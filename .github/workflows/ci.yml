name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # Tests that need a snapshot artifact skip themselves on a fresh clone.
      # The two run manifests are versioned, so the checks that tie the published
      # README figures to the run that produced them do execute here.
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m pip check
