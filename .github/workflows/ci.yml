name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # The release snapshot is versioned whole, so the tests that read it run
      # here on a fresh clone instead of skipping, and test_release_committed
      # fails if any file a rebuild needs is missing or gitignored.
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m pip check
