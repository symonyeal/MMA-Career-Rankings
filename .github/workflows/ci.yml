name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    # Playwright 1.59 has native dependency lists through Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # The WHR passes run in rust/whr_rs when it is installed. Building it here
      # and requiring it makes tests/test_whr_backend.py fail, not skip, if the
      # Rust backend stops matching the numpy reference bit for bit.
      - run: python -m pip install maturin==1.15.0 && python -m pip install ./rust/whr_rs
      - run: cargo clippy --manifest-path rust/whr_rs/Cargo.toml --release -- -D warnings
      - run: cargo fmt --manifest-path rust/whr_rs/Cargo.toml --check
      # The release snapshot is versioned whole, so the tests that read it run
      # here on a fresh clone instead of skipping, and test_release_committed
      # fails if any file a rebuild needs is missing or gitignored.
      - run: python -m pytest -q
        env:
          WHR_RS_REQUIRED: "1"
      - run: python -m ruff check .
      - run: python -m pip check
